<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Threads MCP</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Threads MCP</h1><p>連接目前選取的 Threads 分頁。請先自行登入。</p>
<label for="port">本機連接埠</label><input id="port" type="number" min="1" max="65535" value="19758">
<label for="token">配對碼</label><input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="從本機配對頁複製">
<button id="connect">連接此分頁</button><button id="disconnect" class="secondary">中斷連線</button>
<p id="status" role="status" aria-live="polite">確認連線狀態…</p><p class="note">不讀取 Cookie，不自動切換分頁。斷線後不會重送指令。</p><script src="popup.js"></script></body></html>
